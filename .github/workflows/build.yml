name: Build PrefixGuard
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrefixGuard-source/PrefixGuard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: PrefixGuard
          path: PrefixGuard-source/PrefixGuard/target/PrefixGuard.jar
